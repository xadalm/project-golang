name: Go

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: linkup
          POSTGRES_USER: linkup
          POSTGRES_PASSWORD: linkup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linkup -d linkup"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://linkup:linkup@localhost:5432/linkup?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: PostgreSQL integration tests
        run: go test -tags=integration ./...
      - name: Vet
        run: go vet ./...
      - name: Race detector
        run: go test -race ./...
