services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: linkup
      POSTGRES_USER: linkup
      POSTGRES_PASSWORD: linkup
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkup -d linkup"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - linkup-postgres:/var/lib/postgresql/data

volumes:
  linkup-postgres:
